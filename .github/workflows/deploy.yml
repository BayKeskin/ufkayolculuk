name: Canlıya Otomatik Dağıtım (FTP Deploy)

on:
  push:
    branches:
      - main

jobs:
  web-deploy:
    name: FTP ile Canlıya Dağıt
    runs-on: ubuntu-latest
    steps:
      - name: Depoyu Klonla
        uses: actions/checkout@v4
        with:
          fetch-depth: 2 # Sadece son commit'te değişen dosyaları senkronize eder (çok hızlıdır)

      - name: FTP Senkronizasyonu
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: ${{ secrets.FTP_PORT || 21 }}
          protocol: ftp
          # Bu FTP hesabı doğrudan proje kökünü gördüğü için / olarak kilitliyoruz:
          server-dir: /
          # Sunucudaki canlı ayarları, logları ve geliştirme dosyalarını hariç tutuyoruz:
          exclude: |
            **/.git*
            **/.git*/**
            **/.agents/**
            .env
            writable/cache/**
            writable/logs/**
            writable/session/**
            tests/**
            phpunit.dist.xml
            *.md
