<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 580" width="100%" height="100%">
  <defs>
    <linearGradient id="mBgGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="50%" stop-color="#0369A1"/>
      <stop offset="100%" stop-color="#0B2B6F"/>
    </linearGradient>
    <linearGradient id="mGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <filter id="mShadow1" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Arka Plan -->
  <rect width="540" height="580" rx="20" fill="url(#mBgGrad1)"/>
  
  <!-- Işık Halkaları -->
  <circle cx="440" cy="120" r="180" fill="#38BDF8" opacity="0.18"/>
  <circle cx="100" cy="460" r="160" fill="#BAE6FD" opacity="0.12"/>

  <!-- Üst Başlık & Rozet Grubu -->
  <g transform="translate(40, 45)">
    <!-- Pill Badge -->
    <rect width="130" height="28" rx="14" fill="#F5A623"/>
    <text x="65" y="19" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="800" fill="#0F172A" text-anchor="middle" letter-spacing="1">12. YARIŞMA</text>
    
    <!-- Ana Başlık -->
    <text x="0" y="70" font-family="'Plus Jakarta Sans', sans-serif" font-size="34" font-weight="900" fill="#FFFFFF">
      <tspan x="0" dy="0">Oku, keşfet,</tspan>
      <tspan x="0" dy="42" fill="#FDE047">öğren, kazan!</tspan>
    </text>
    
    <!-- Alt Açıklama -->
    <text x="0" y="155" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="500" fill="#E0F2FE">
      <tspan x="0" dy="0">Kitap oku, soruları çöz, puan topla</tspan>
      <tspan x="0" dy="22">ve değerli ödüller kazan!</tspan>
    </text>
  </g>

  <!-- Orta 3D Kitap & Doğa Görseli -->
  <g transform="translate(85, 230)" filter="url(#mShadow1)">
    <!-- Açık Kitap -->
    <path d="M50 180 Q180 165 185 115 Q190 165 320 180 L335 220 Q190 205 185 170 Q180 205 35 220 Z" fill="#F8FAFC"/>
    <path d="M50 180 Q180 165 185 115 L185 170 Q180 205 35 220 Z" fill="#E2E8F0"/>
    <path d="M320 180 Q190 165 185 115 L185 170 Q190 205 335 220 Z" fill="#F1F5F9"/>

    <!-- Dağlar ve Doğa -->
    <polygon points="110,120 155,50 200,120" fill="#10B981"/>
    <polygon points="155,120 210,25 265,120" fill="#059669"/>
    <polygon points="65,135 110,75 155,135" fill="#34D399"/>
    
    <!-- Güneş / Işık -->
    <circle cx="185" cy="30" r="24" fill="url(#mGoldGrad)"/>

    <!-- Kupa / Ödül -->
    <g transform="translate(235, 25)">
      <path d="M10 10h32v16c0 10-6 16-16 16s-16-6-16-16V10z" fill="url(#mGoldGrad)"/>
      <path d="M2 15c-4 0-4 10 4 10h4v-10H2zM50 15c4 0 4 10-4 10h-4v-10h4z" fill="url(#mGoldGrad)"/>
      <path d="M26 42v12M14 54h24" stroke="#F59E0B" stroke-width="4.5" stroke-linecap="round"/>
    </g>
  </g>

  <!-- Alt Buton -->
  <g transform="translate(40, 485)">
    <rect width="460" height="52" rx="12" fill="#F5A623" filter="url(#mShadow1)"/>
    <text x="210" y="32" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="800" fill="#0F172A" text-anchor="middle">Ücretsiz Kayıt Ol</text>
    <path d="M295 26l6 6m0 0l-6 6m6-6h-18" stroke="#0F172A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
