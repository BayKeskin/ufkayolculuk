<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 580" width="100%" height="100%">
  <defs>
    <linearGradient id="mBgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1B4B"/>
      <stop offset="50%" stop-color="#312E81"/>
      <stop offset="100%" stop-color="#4338CA"/>
    </linearGradient>
    <filter id="mShadow2" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Arka Plan -->
  <rect width="540" height="580" rx="20" fill="url(#mBgGrad2)"/>
  <circle cx="440" cy="140" r="180" fill="#6366F1" opacity="0.22"/>
  <circle cx="100" cy="460" r="150" fill="#818CF8" opacity="0.12"/>

  <!-- Üst Başlık & Rozet Grubu -->
  <g transform="translate(40, 45)">
    <rect width="130" height="28" rx="14" fill="#F5A623"/>
    <text x="65" y="19" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="800" fill="#0F172A" text-anchor="middle" letter-spacing="1">ONLINE SINAV</text>
    
    <text x="0" y="70" font-family="'Plus Jakarta Sans', sans-serif" font-size="34" font-weight="900" fill="#FFFFFF">
      <tspan x="0" dy="0">Evinden Rahatça</tspan>
      <tspan x="0" dy="42" fill="#FDE047">Sınava Katıl!</tspan>
    </text>
    
    <text x="0" y="155" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="500" fill="#E0E7FF">
      <tspan x="0" dy="0">Bilgisayar, tablet veya telefonunla</tspan>
      <tspan x="0" dy="22">1. aşama online sınava katıl.</tspan>
    </text>
  </g>

  <!-- Orta 3D Laptop & Sınav Görseli -->
  <g transform="translate(95, 235)" filter="url(#mShadow2)">
    <rect x="25" y="20" width="300" height="175" rx="10" fill="#0F172A" stroke="#475569" stroke-width="3"/>
    <rect x="36" y="30" width="278" height="155" rx="5" fill="#1E293B"/>
    
    <rect x="55" y="45" width="130" height="12" rx="3" fill="#6366F1"/>
    <rect x="55" y="66" width="180" height="7" rx="3" fill="#475569"/>
    <rect x="55" y="79" width="150" height="7" rx="3" fill="#475569"/>
    
    <rect x="55" y="100" width="105" height="22" rx="5" fill="#22C55E"/>
    <text x="107" y="115" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="800" fill="#FFFFFF" text-anchor="middle">✓ Doğru Cevap</text>

    <rect x="170" y="100" width="105" height="22" rx="5" fill="#334155"/>
    <rect x="55" y="130" width="105" height="22" rx="5" fill="#334155"/>
    <rect x="170" y="130" width="105" height="22" rx="5" fill="#334155"/>

    <path d="M0 195 L350 195 L320 216 L30 216 Z" fill="#334155"/>
    <rect x="145" y="198" width="60" height="5" rx="2.5" fill="#64748B"/>
  </g>

  <!-- Alt Buton -->
  <g transform="translate(40, 485)">
    <rect width="460" height="52" rx="12" fill="#F5A623" filter="url(#mShadow2)"/>
    <text x="210" y="32" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="800" fill="#0F172A" text-anchor="middle">Şartnameyi İncele</text>
    <path d="M295 26l6 6m0 0l-6 6m6-6h-18" stroke="#0F172A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
