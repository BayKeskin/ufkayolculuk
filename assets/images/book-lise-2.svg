<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 280" fill="none">
  <defs>
    <linearGradient id="sunsetSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="40%" stop-color="#F97316"/>
      <stop offset="70%" stop-color="#FDE047"/>
      <stop offset="100%" stop-color="#EA580C"/>
    </linearGradient>
    <linearGradient id="seaGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#C2410C"/>
      <stop offset="30%" stop-color="#9A3412"/>
      <stop offset="100%" stop-color="#1E3A8A"/>
    </linearGradient>
  </defs>
  <!-- Background Sunset Sky -->
  <rect width="200" height="280" rx="8" fill="url(#sunsetSky)"/>

  <!-- Glowing Sun on Horizon -->
  <circle cx="100" cy="170" r="32" fill="#FEF08A"/>

  <!-- Sea Surface -->
  <rect x="0" y="175" width="200" height="105" fill="url(#seaGrad)"/>
  <ellipse cx="100" cy="180" rx="60" ry="3" fill="#FDE047" opacity="0.6"/>
  <ellipse cx="100" cy="190" rx="40" ry="2" fill="#FDE047" opacity="0.4"/>
  <ellipse cx="100" cy="205" rx="25" ry="2" fill="#FDE047" opacity="0.3"/>

  <!-- Vintage Galleon / Sailing Ship -->
  <g transform="translate(68, 115)">
    <!-- Ship Hull -->
    <path d="M 0 52 C 15 50 50 50 65 52 L 55 68 C 45 74 20 74 10 68 Z" fill="#451A03"/>
    
    <!-- Masts -->
    <line x1="16" y1="52" x2="16" y2="12" stroke="#451A03" stroke-width="2.5"/>
    <line x1="36" y1="52" x2="36" y2="0" stroke="#451A03" stroke-width="2.5"/>
    <line x1="52" y1="52" x2="52" y2="18" stroke="#451A03" stroke-width="2"/>

    <!-- Sails (White/Cream Wind-filled) -->
    <!-- Main Mast Sails -->
    <path d="M 24 5 C 36 2 44 2 48 5 C 44 18 36 18 24 18 C 28 10 28 8 24 5 Z" fill="#FFFBEB"/>
    <path d="M 22 22 C 36 18 46 18 50 22 C 46 36 36 36 22 36 C 26 28 26 25 22 22 Z" fill="#FEF3C7"/>
    <path d="M 20 39 C 36 35 48 35 52 39 C 48 49 36 49 20 49 C 24 44 24 42 20 39 Z" fill="#FEF08A"/>

    <!-- Fore Mast Sails -->
    <path d="M 6 15 C 16 12 24 12 26 15 C 24 28 16 28 6 28 C 10 21 10 18 6 15 Z" fill="#FFFBEB"/>
    <path d="M 4 32 C 16 28 24 28 28 32 C 26 44 16 44 4 44 C 8 38 8 35 4 32 Z" fill="#FEF3C7"/>

    <!-- Mizzen Mast Sail -->
    <path d="M 44 22 C 52 19 58 19 60 22 C 58 34 52 34 44 34 Z" fill="#FFFBEB"/>

    <!-- Water reflection / ripples under ship -->
    <ellipse cx="32" cy="71" rx="30" ry="3" fill="#1E293B" opacity="0.5"/>
  </g>

  <!-- Spine Shadow -->
  <rect x="0" y="0" width="8" height="280" fill="#000000" opacity="0.3"/>
</svg>
