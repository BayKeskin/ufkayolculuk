<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 280" fill="none">
  <defs>
    <linearGradient id="wallGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="60%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <radialGradient id="portalGlow" cx="50%" cy="60%" r="50%">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="30%" stop-color="#FBBF24"/>
      <stop offset="70%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#78350F"/>
    </radialGradient>
  </defs>
  <!-- Background Walls -->
  <rect width="200" height="280" rx="8" fill="url(#wallGrad)"/>

  <!-- Ancient Portal Archway -->
  <path d="M 40 280 L 40 120 C 40 70 160 70 160 120 L 160 280 Z" fill="url(#portalGlow)"/>
  
  <!-- Outer Arch Trim -->
  <path d="M 30 280 L 30 115 C 30 55 170 55 170 115 L 170 280" stroke="#334155" stroke-width="8" fill="none"/>
  <path d="M 22 280 L 22 110 C 22 45 178 45 178 110 L 178 280" stroke="#1E293B" stroke-width="6" fill="none"/>

  <!-- Light rays from inside -->
  <polygon points="100,100 20,280 180,280" fill="#FEF9C3" opacity="0.3"/>

  <!-- Silhouette of Child in Portal -->
  <g transform="translate(93, 175)" fill="#0F172A">
    <!-- Head -->
    <circle cx="7" cy="5" r="5"/>
    <!-- Body -->
    <path d="M 2 12 L 12 12 L 14 30 L 0 30 Z"/>
    <!-- Legs -->
    <rect x="1" y="30" width="4" height="20" rx="1"/>
    <rect x="9" y="30" width="4" height="20" rx="1"/>
    <!-- Arms -->
    <rect x="-2" y="13" width="3" height="15" rx="1"/>
    <rect x="13" y="13" width="3" height="15" rx="1"/>
    <!-- Ground Shadow -->
    <ellipse cx="7" cy="50" rx="14" ry="3" fill="#451A03" opacity="0.8"/>
  </g>

  <!-- Spine Shadow -->
  <rect x="0" y="0" width="8" height="280" fill="#000000" opacity="0.4"/>
</svg>
