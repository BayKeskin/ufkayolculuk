<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1B4B"/>
      <stop offset="50%" stop-color="#312E81"/>
      <stop offset="100%" stop-color="#4338CA"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C084FC"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>
    <filter id="shadow2" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Arka Plan -->
  <rect width="1200" height="420" rx="16" fill="url(#bgGrad2)"/>
  
  <!-- Işık Efektleri -->
  <circle cx="1000" cy="200" r="280" fill="#6366F1" opacity="0.2"/>
  <circle cx="200" cy="380" r="160" fill="#818CF8" opacity="0.12"/>

  <!-- Sol Metin Alanı -->
  <g transform="translate(80, 80)">
    <!-- Pill Badge -->
    <rect width="160" height="32" rx="16" fill="#F5A623"/>
    <text x="80" y="21" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="800" fill="#0F172A" text-anchor="middle" letter-spacing="1">ONLINE SINAV</text>
    
    <!-- Ana Başlık -->
    <text x="0" y="90" font-family="'Plus Jakarta Sans', sans-serif" font-size="44" font-weight="900" fill="#FFFFFF">
      <tspan x="0" dy="0">Evinden Rahatça</tspan>
      <tspan x="0" dy="52" fill="#FDE047">Sınava Katıl!</tspan>
    </text>
    
    <!-- Alt Açıklama -->
    <text x="0" y="200" font-family="'Plus Jakarta Sans', sans-serif" font-size="18" font-weight="500" fill="#E0E7FF">
      Bilgisayar, tablet veya cep telefonunla 1. aşama online sınava katıl.
    </text>

    <!-- Buton -->
    <g transform="translate(0, 235)">
      <rect width="240" height="48" rx="10" fill="#F5A623" filter="url(#shadow2)"/>
      <text x="20" y="30" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="800" fill="#0F172A" text-anchor="start">Şartnameyi İncele</text>
      <path d="M204 18l8 6-8 6M212 24h-18" stroke="#0F172A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>

  <!-- Sağ 3D Laptop ve Sınav Görseli -->
  <g transform="translate(740, 70)" filter="url(#shadow2)">
    <!-- Laptop Ekranı -->
    <rect x="50" y="40" width="300" height="190" rx="12" fill="#0F172A" stroke="#475569" stroke-width="4"/>
    <rect x="62" y="52" width="276" height="166" rx="6" fill="#1E293B"/>
    
    <!-- Ekran İçi Grafik (Soru Çözme) -->
    <rect x="80" y="70" width="140" height="14" rx="4" fill="#6366F1"/>
    <rect x="80" y="95" width="200" height="8" rx="3" fill="#475569"/>
    <rect x="80" y="110" width="170" height="8" rx="3" fill="#475569"/>
    
    <!-- Seçenekler -->
    <rect x="80" y="135" width="110" height="24" rx="6" fill="#22C55E"/>
    <text x="135" y="152" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="800" fill="#FFFFFF" text-anchor="middle">✓ Doğru Cevap</text>

    <rect x="200" y="135" width="110" height="24" rx="6" fill="#334155"/>
    <rect x="80" y="170" width="110" height="24" rx="6" fill="#334155"/>
    <rect x="200" y="170" width="110" height="24" rx="6" fill="#334155"/>

    <!-- Laptop Alt Gövde / Klavye -->
    <path d="M20 230 L380 230 L350 255 L50 255 Z" fill="#334155"/>
    <rect x="170" y="234" width="60" height="6" rx="3" fill="#64748B"/>
  </g>
</svg>
