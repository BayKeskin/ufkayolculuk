<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064E3B"/>
      <stop offset="50%" stop-color="#047857"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="trophyGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="50%" stop-color="#FACC15"/>
      <stop offset="100%" stop-color="#CA8A04"/>
    </linearGradient>
    <filter id="shadow3" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Arka Plan -->
  <rect width="1200" height="420" rx="16" fill="url(#bgGrad3)"/>
  
  <!-- Işık Efektleri -->
  <circle cx="980" cy="200" r="260" fill="#34D399" opacity="0.2"/>
  <circle cx="150" cy="100" r="150" fill="#6EE7B7" opacity="0.1"/>

  <!-- Sol Metin Alanı -->
  <g transform="translate(80, 80)">
    <!-- Pill Badge -->
    <rect width="150" height="32" rx="16" fill="#F5A623"/>
    <text x="75" y="21" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="800" fill="#0F172A" text-anchor="middle" letter-spacing="1">ÖDÜL HAVUZU</text>
    
    <!-- Ana Başlık -->
    <text x="0" y="90" font-family="'Plus Jakarta Sans', sans-serif" font-size="44" font-weight="900" fill="#FFFFFF">
      <tspan x="0" dy="0">Büyük Ödüller</tspan>
      <tspan x="0" dy="52" fill="#FDE047">Seni Bekliyor!</tspan>
    </text>
    
    <!-- Alt Açıklama -->
    <text x="0" y="200" font-family="'Plus Jakarta Sans', sans-serif" font-size="18" font-weight="500" fill="#D1FAE5">
      Milli ve il düzeyinde dereceye giren yarışmacılara yüzlerce muhteşem hediye.
    </text>

    <!-- Buton -->
    <g transform="translate(0, 235)">
      <rect width="240" height="48" rx="10" fill="#F5A623" filter="url(#shadow3)"/>
      <text x="20" y="30" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="800" fill="#0F172A" text-anchor="start">Tüm Ödülleri Gör</text>
      <path d="M204 18l8 6-8 6M212 24h-18" stroke="#0F172A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>

  <!-- Sağ 3D Hediye ve Kupa Görseli -->
  <g transform="translate(760, 60)" filter="url(#shadow3)">
    <!-- Büyük Altın Kupa -->
    <g transform="translate(130, 20)">
      <path d="M20 20h80v45c0 24-16 40-40 40s-40-16-40-40V20z" fill="url(#trophyGold)"/>
      <path d="M0 30c-12 0-12 24 12 24h8v-24H0zM120 30c12 0 12 24-12 24h-8v-24h20z" fill="url(#trophyGold)"/>
      <path d="M60 105v35M30 140h60" stroke="#CA8A04" stroke-width="12" stroke-linecap="round"/>
      <rect x="20" y="140" width="80" height="35" rx="8" fill="#1E293B"/>
      <rect x="35" y="152" width="50" height="12" rx="4" fill="#FACC15"/>
    </g>

    <!-- Hediye Kutuları -->
    <g transform="translate(30, 150)">
      <rect x="0" y="30" width="90" height="80" rx="8" fill="#EF4444"/>
      <rect x="35" y="30" width="20" height="80" fill="#FACC15"/>
      <rect x="0" y="60" width="90" height="20" fill="#FACC15"/>
      <rect x="-5" y="20" width="100" height="18" rx="4" fill="#DC2626"/>
      <path d="M45 20c-15-20 0-25 15-5c15-20 30-15 15 5z" fill="#FACC15"/>
    </g>

    <g transform="translate(240, 160)">
      <rect x="0" y="25" width="80" height="70" rx="8" fill="#3B82F6"/>
      <rect x="30" y="25" width="20" height="70" fill="#FACC15"/>
      <rect x="0" y="50" width="80" height="20" fill="#FACC15"/>
      <rect x="-5" y="15" width="90" height="16" rx="4" fill="#2563EB"/>
    </g>
  </g>
</svg>
