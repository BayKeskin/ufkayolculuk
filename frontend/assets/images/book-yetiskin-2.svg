<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 280" fill="none">
  <defs>
    <linearGradient id="purpleSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#C084FC"/>
      <stop offset="50%" stop-color="#E9D5FF"/>
      <stop offset="100%" stop-color="#F3E8FF"/>
    </linearGradient>
    <radialGradient id="sakuraGlow" cx="50%" cy="45%" r="45%">
      <stop offset="0%" stop-color="#F472B6"/>
      <stop offset="60%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#6B21A8"/>
    </radialGradient>
    <linearGradient id="purpleGround" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#D8B4FE"/>
      <stop offset="100%" stop-color="#9333EA"/>
    </linearGradient>
  </defs>
  <!-- Background Pastel Sky -->
  <rect width="200" height="280" rx="8" fill="url(#purpleSky)"/>

  <!-- Soft Moon / Glow -->
  <circle cx="100" cy="120" r="55" fill="#FAF5FF" opacity="0.9"/>

  <!-- Ground / Hill -->
  <path d="M 0 220 Q 100 200 200 220 L 200 280 L 0 280 Z" fill="url(#purpleGround)"/>

  <!-- Tree Trunk & Twisted Branches -->
  <g transform="translate(100, 205)">
    <path d="M -8 15 C -8 0 -22 -20 -35 -35 L -26 -37 C -15 -25 -4 -8 -2 5 Z" fill="#581C87"/>
    <path d="M 8 15 C 8 0 22 -20 35 -35 L 26 -37 C 15 -25 4 -8 2 5 Z" fill="#581C87"/>
    <path d="M -5 15 C -3 -10 -8 -30 -12 -50 L -5 -52 C -2 -30 2 -8 5 15 Z" fill="#3B0764"/>
    <path d="M 0 15 C 2 -10 8 -30 12 -50 L 5 -52 C 2 -30 -2 -8 0 15 Z" fill="#3B0764"/>
  </g>

  <!-- Glowing Sakura Canopy -->
  <g transform="translate(100, 120)">
    <circle cx="-35" cy="-8" r="30" fill="url(#sakuraGlow)"/>
    <circle cx="35" cy="-8" r="30" fill="url(#sakuraGlow)"/>
    <circle cx="0" cy="-30" r="35" fill="#E879F9"/>
    <circle cx="-18" cy="-20" r="26" fill="#F472B6" opacity="0.9"/>
    <circle cx="18" cy="-20" r="26" fill="#C084FC" opacity="0.9"/>
    <circle cx="0" cy="0" r="32" fill="url(#sakuraGlow)"/>

    <!-- Falling Petals -->
    <ellipse cx="-40" cy="40" rx="3" ry="1.5" fill="#F472B6" transform="rotate(25 -40 40)"/>
    <ellipse cx="45" cy="50" rx="3" ry="1.5" fill="#F472B6" transform="rotate(-35 45 50)"/>
    <ellipse cx="-15" cy="65" rx="3" ry="1.5" fill="#E879F9" transform="rotate(15 -15 65)"/>
    <ellipse cx="25" cy="75" rx="3" ry="1.5" fill="#E879F9" transform="rotate(-20 25 75)"/>
  </g>

  <!-- Spine Shadow -->
  <rect x="0" y="0" width="8" height="280" fill="#000000" opacity="0.3"/>
</svg>
