<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="giftBox" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#6B21A8"/>
    </linearGradient>
    <linearGradient id="giftRibbon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
  </defs>
  <!-- Box Base -->
  <rect x="20" y="42" width="60" height="48" rx="8" fill="url(#giftBox)"/>
  
  <!-- Lid -->
  <rect x="15" y="32" width="70" height="14" rx="4" fill="#C084FC"/>
  
  <!-- Vertical Ribbon -->
  <rect x="44" y="32" width="12" height="58" fill="url(#giftRibbon)"/>
  
  <!-- Ribbon Bow -->
  <path d="M 50 32 C 38 16 28 26 44 32 Z" fill="url(#giftRibbon)"/>
  <path d="M 50 32 C 62 16 72 26 56 32 Z" fill="url(#giftRibbon)"/>
  <circle cx="50" cy="32" r="5" fill="#D97706"/>
</svg>
