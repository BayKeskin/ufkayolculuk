<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 580" width="100%" height="100%">
  <defs>
    <linearGradient id="mBgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064E3B"/>
      <stop offset="50%" stop-color="#047857"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="mTrophyGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="50%" stop-color="#FACC15"/>
      <stop offset="100%" stop-color="#CA8A04"/>
    </linearGradient>
    <filter id="mShadow3" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Arka Plan -->
  <rect width="540" height="580" rx="20" fill="url(#mBgGrad3)"/>
  <circle cx="440" cy="140" r="180" fill="#34D399" opacity="0.2"/>
  <circle cx="100" cy="460" r="150" fill="#6EE7B7" opacity="0.1"/>

  <!-- Üst Başlık & Rozet Grubu -->
  <g transform="translate(40, 45)">
    <rect width="130" height="28" rx="14" fill="#F5A623"/>
    <text x="65" y="19" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="800" fill="#0F172A" text-anchor="middle" letter-spacing="1">ÖDÜL HAVUZU</text>
    
    <text x="0" y="70" font-family="'Plus Jakarta Sans', sans-serif" font-size="34" font-weight="900" fill="#FFFFFF">
      <tspan x="0" dy="0">Büyük Ödüller</tspan>
      <tspan x="0" dy="42" fill="#FDE047">Seni Bekliyor!</tspan>
    </text>
    
    <text x="0" y="155" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="500" fill="#D1FAE5">
      <tspan x="0" dy="0">Milli ve il düzeyinde dereceye girenlere</tspan>
      <tspan x="0" dy="22">yüzlerce muhteşem hediye.</tspan>
    </text>
  </g>

  <!-- Orta 3D Kupa & Hediye Görseli -->
  <g transform="translate(110, 240)" filter="url(#mShadow3)">
    <!-- Büyük Kupa -->
    <g transform="translate(120, 10)">
      <path d="M15 15h65v35c0 18-13 30-32.5 30S15 68 15 50V15z" fill="url(#mTrophyGold)"/>
      <path d="M0 22c-9 0-9 18 9 18h6v-18H0zM95 22c9 0 9 18-9 18h-6v-18h15z" fill="url(#mTrophyGold)"/>
      <path d="M47.5 80v25M25 105h45" stroke="#CA8A04" stroke-width="9" stroke-linecap="round"/>
      <rect x="18" y="105" width="60" height="26" rx="6" fill="#1E293B"/>
      <rect x="30" y="114" width="36" height="8" rx="3" fill="#FACC15"/>
    </g>

    <!-- Hediye Kutusu Kırmızı -->
    <g transform="translate(20, 90)">
      <rect x="0" y="20" width="70" height="60" rx="6" fill="#EF4444"/>
      <rect x="27" y="20" width="16" height="60" fill="#FACC15"/>
      <rect x="0" y="42" width="70" height="16" fill="#FACC15"/>
      <rect x="-4" y="12" width="78" height="14" rx="3" fill="#DC2626"/>
      <path d="M35 12c-10-15 0-18 10-4c10-15 20-10 10 4z" fill="#FACC15"/>
    </g>

    <!-- Hediye Kutusu Mavi -->
    <g transform="translate(230, 95)">
      <rect x="0" y="20" width="65" height="55" rx="6" fill="#3B82F6"/>
      <rect x="25" y="20" width="15" height="55" fill="#FACC15"/>
      <rect x="0" y="40" width="65" height="15" fill="#FACC15"/>
      <rect x="-4" y="12" width="73" height="13" rx="3" fill="#2563EB"/>
    </g>
  </g>

  <!-- Alt Buton -->
  <g transform="translate(40, 485)">
    <rect width="460" height="52" rx="12" fill="#F5A623" filter="url(#mShadow3)"/>
    <text x="210" y="32" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="800" fill="#0F172A" text-anchor="middle">Tüm Ödülleri Gör</text>
    <path d="M295 26l6 6m0 0l-6 6m6-6h-18" stroke="#0F172A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
