<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 280" fill="none">
  <defs>
    <radialGradient id="spaceGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1E1B4B"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>
    <radialGradient id="starGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FDE047" stop-opacity="1"/>
      <stop offset="60%" stop-color="#F59E0B" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="200" height="280" rx="8" fill="url(#spaceGrad)"/>
  
  <!-- Glowing Constellations and Stars -->
  <g>
    <!-- Big glowing center star -->
    <circle cx="100" cy="130" r="28" fill="url(#starGlow)"/>
    <polygon points="100,105 103,125 125,130 103,135 100,155 97,135 75,130 97,125" fill="#FEF08A"/>

    <!-- Star 2 -->
    <circle cx="50" cy="80" r="14" fill="url(#starGlow)"/>
    <polygon points="50,68 52,78 62,80 52,82 50,92 48,82 38,80 48,78" fill="#FFFBEB"/>

    <!-- Star 3 -->
    <circle cx="150" cy="90" r="16" fill="url(#starGlow)"/>
    <polygon points="150,78 152,88 162,90 152,92 150,102 148,92 138,90 148,88" fill="#FEF08A"/>

    <!-- Star 4 -->
    <circle cx="140" cy="190" r="18" fill="url(#starGlow)"/>
    <polygon points="140,178 142,188 152,190 142,192 140,202 138,192 128,190 138,188" fill="#FEF08A"/>

    <!-- Star 5 -->
    <circle cx="60" cy="200" r="14" fill="url(#starGlow)"/>
    <polygon points="60,188 62,198 72,200 62,202 60,212 58,202 48,200 58,198" fill="#FFFBEB"/>

    <!-- Constellation Lines -->
    <line x1="50" y1="80" x2="100" y2="130" stroke="#F59E0B" stroke-width="0.8" stroke-dasharray="2 2" opacity="0.6"/>
    <line x1="150" y1="90" x2="100" y2="130" stroke="#F59E0B" stroke-width="0.8" stroke-dasharray="2 2" opacity="0.6"/>
    <line x1="140" y1="190" x2="100" y2="130" stroke="#F59E0B" stroke-width="0.8" stroke-dasharray="2 2" opacity="0.6"/>
    <line x1="60" y1="200" x2="100" y2="130" stroke="#F59E0B" stroke-width="0.8" stroke-dasharray="2 2" opacity="0.6"/>

    <!-- Little Sparkles -->
    <circle cx="30" cy="40" r="1.5" fill="#FFFFFF"/>
    <circle cx="85" cy="45" r="1.5" fill="#FEF08A"/>
    <circle cx="170" cy="40" r="1" fill="#FFFFFF"/>
    <circle cx="180" cy="150" r="1.5" fill="#FFFFFF"/>
    <circle cx="25" cy="140" r="1.5" fill="#FEF08A"/>
    <circle cx="35" cy="250" r="1" fill="#FFFFFF"/>
    <circle cx="165" cy="245" r="1.5" fill="#FEF08A"/>
    <circle cx="110" cy="240" r="1" fill="#FFFFFF"/>
  </g>

  <!-- Spine Shadow -->
  <rect x="0" y="0" width="8" height="280" fill="#000000" opacity="0.4"/>
</svg>
