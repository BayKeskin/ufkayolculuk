<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 280" fill="none">
  <defs>
    <linearGradient id="liseSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="40%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <radialGradient id="nebula" cx="50%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#1E40AF" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#020617" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Background -->
  <rect width="200" height="280" rx="8" fill="url(#liseSky)"/>
  <rect width="200" height="280" rx="8" fill="url(#nebula)"/>

  <!-- Clouds & Nebula glow -->
  <ellipse cx="100" cy="80" rx="70" ry="30" fill="#67E8F9" opacity="0.25"/>
  <ellipse cx="120" cy="110" rx="50" ry="25" fill="#38BDF8" opacity="0.3"/>

  <!-- Stars -->
  <circle cx="40" cy="50" r="1.5" fill="#FFFFFF"/>
  <circle cx="160" cy="60" r="1.5" fill="#FFFFFF"/>
  <circle cx="90" cy="35" r="2" fill="#BAE6FD"/>
  <circle cx="130" cy="75" r="1" fill="#FFFFFF"/>
  <circle cx="70" cy="95" r="1.5" fill="#FFFFFF"/>

  <!-- Silhouette of person standing on rock -->
  <path d="M 0 250 Q 100 230 200 250 L 200 280 L 0 280 Z" fill="#020617"/>
  
  <g transform="translate(92, 145)" fill="#020617">
    <!-- Head -->
    <circle cx="8" cy="8" r="7"/>
    <!-- Body -->
    <path d="M 2 18 L 14 18 L 17 50 L -1 50 Z"/>
    <!-- Legs -->
    <rect x="0" y="50" width="6" height="42" rx="2"/>
    <rect x="10" y="50" width="6" height="42" rx="2"/>
    <!-- Arms -->
    <rect x="-4" y="20" width="4.5" height="30" rx="2"/>
    <rect x="15.5" y="20" width="4.5" height="30" rx="2"/>
  </g>

  <!-- Spine Shadow -->
  <rect x="0" y="0" width="8" height="280" fill="#000000" opacity="0.4"/>
</svg>
