<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <linearGradient id="botHead" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
    <linearGradient id="botVisor" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <radialGradient id="eyeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </radialGradient>
    <filter id="robotShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000000" flood-opacity="0.15"/>
    </filter>
  </defs>

  <g filter="url(#robotShadow)">
    <!-- Ears / Yellow Side Pods -->
    <rect x="10" y="44" width="10" height="24" rx="5" fill="#F59E0B"/>
    <rect x="100" y="44" width="10" height="24" rx="5" fill="#F59E0B"/>

    <!-- Head Outer Shell -->
    <rect x="16" y="20" width="88" height="72" rx="36" fill="url(#botHead)" stroke="#F8FAFC" stroke-width="2"/>
    
    <!-- Top Small Antenna -->
    <rect x="57" y="10" width="6" height="12" rx="3" fill="#94A3B8"/>
    <circle cx="60" cy="8" r="5" fill="#F59E0B"/>

    <!-- Dark Glossy Screen / Visor -->
    <rect x="26" y="32" width="68" height="46" rx="20" fill="url(#botVisor)"/>

    <!-- Glowing Cyan/Blue Eyes -->
    <ellipse cx="44" cy="55" rx="8" ry="11" fill="url(#eyeGlow)"/>
    <ellipse cx="76" cy="55" rx="8" ry="11" fill="url(#eyeGlow)"/>

    <!-- Eye Highlights -->
    <circle cx="47" cy="50" r="3" fill="#FFFFFF"/>
    <circle cx="79" cy="50" r="3" fill="#FFFFFF"/>
    
    <!-- Cute Cheeks -->
    <ellipse cx="36" cy="65" rx="4" ry="2" fill="#F43F5E" opacity="0.6"/>
    <ellipse cx="84" cy="65" rx="4" ry="2" fill="#F43F5E" opacity="0.6"/>
  </g>
</svg>
