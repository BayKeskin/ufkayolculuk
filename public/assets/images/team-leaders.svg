<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 160" fill="none">
  <!-- Team Spirit Arc Text / Sparkles -->
  <text x="120" y="32" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="13" fill="#0284C7" text-anchor="middle" letter-spacing="4">BİRLİKTE GÜÇLÜYÜZ</text>

  <!-- Sparkles around high-five -->
  <path d="M 120 40 L 122 46 L 128 48 L 122 50 L 120 56 L 118 50 L 112 48 L 118 46 Z" fill="#F59E0B"/>
  <circle cx="108" cy="42" r="2" fill="#FBBF24"/>
  <circle cx="132" cy="42" r="2" fill="#FBBF24"/>

  <!-- Left Character (Young Student 1) -->
  <g transform="translate(45, 45)">
    <!-- Hair & Head -->
    <circle cx="28" cy="22" r="14" fill="#FCD34D"/>
    <path d="M 16 18 C 16 10 38 8 40 18 C 38 12 24 10 16 18 Z" fill="#0F172A"/>
    <!-- Face / Ear -->
    <circle cx="28" cy="24" r="11" fill="#FDE68A"/>
    <circle cx="17" cy="25" r="3" fill="#FDE68A"/>
    <circle cx="26" cy="22" r="1.5" fill="#0F172A"/>
    <path d="M 28 27 Q 32 29 34 26" stroke="#0F172A" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    
    <!-- Torso / Blue Shirt -->
    <path d="M 12 42 Q 28 36 44 42 L 50 115 L 6 115 Z" fill="#FFFFFF" stroke="#0284C7" stroke-width="2.5"/>
    <path d="M 22 40 L 28 50 L 34 40" stroke="#0284C7" stroke-width="2" fill="none"/>
    
    <!-- Arm reaching up to high-five -->
    <path d="M 40 46 Q 60 40 72 20" stroke="#0284C7" stroke-width="6" stroke-linecap="round" fill="none"/>
    <circle cx="73" cy="18" r="5" fill="#FDE68A"/>
  </g>

  <!-- Right Character (Young Student 2) -->
  <g transform="translate(130, 45)">
    <!-- Hair & Head -->
    <circle cx="32" cy="22" r="14" fill="#FCD34D"/>
    <path d="M 20 18 C 22 8 44 10 46 20 C 42 12 28 10 20 18 Z" fill="#1E293B"/>
    <!-- Face -->
    <circle cx="32" cy="24" r="11" fill="#FDE68A"/>
    <circle cx="43" cy="25" r="3" fill="#FDE68A"/>
    <circle cx="34" cy="22" r="1.5" fill="#0F172A"/>
    <path d="M 26 26 Q 28 29 32 27" stroke="#0F172A" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    
    <!-- Torso / Yellow Shirt -->
    <path d="M 16 42 Q 32 36 48 42 L 54 115 L 10 115 Z" fill="#FDE68A" stroke="#D97706" stroke-width="2.5"/>
    
    <!-- Arm reaching up to high-five -->
    <path d="M 20 46 Q 0 40 -12 20" stroke="#D97706" stroke-width="6" stroke-linecap="round" fill="none"/>
    <circle cx="-13" cy="18" r="5" fill="#FDE68A"/>
  </g>
</svg>
